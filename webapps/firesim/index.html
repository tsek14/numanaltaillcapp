<script>
const $=id=>document.getElementById(id),log=(m,er)=>{const s=document.createElement('span');s.textContent=m+'\n';if(er)s.className='er';$('log').append(s);return s};
let lang='mn';const L=(m,e)=>lang=='en'?e:m;
const OGC='https://sh.dataspace.copernicus.eu/ogc/wms/';
const ES={
rgb:`//VERSION=3
function setup(){return{input:[{bands:["B02","B03","B04","SCL","dataMask"]}],mosaicking:"TILE",output:{bands:3,sampleType:"UINT8"}}}
function preProcessScenes(c){c.scenes.tiles=c.scenes.tiles.sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,8);return c}
function evaluatePixel(a){const f=s=>[s.B04,s.B03,s.B02].map(v=>Math.round(255*Math.min(1,2.8*v)));for(const s of a){if(s.dataMask&&![0,1,3,8,9,10].includes(s.SCL))return f(s)}return a.length?f(a[0]):[0,0,0]}`,
nbr:`//VERSION=3
function setup(){return{input:[{bands:["B08","B12","SCL","dataMask"]}],mosaicking:"TILE",output:{bands:3,sampleType:"UINT8"}}}
function preProcessScenes(c){c.scenes.tiles=c.scenes.tiles.sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,8);return c}
function evaluatePixel(a){for(const s of a){if(s.dataMask&&![0,1,6,8,9,10,11].includes(s.SCL))return[Math.round((s.B08-s.B12)/(s.B08+s.B12+1e-6)*127.5+127.5),255,Math.min(255,Math.round((s.B08+s.B12)*255))]}return[0,0,0]}`};
let cool=0,nRetry=0,rl=null,S={},R,scene,cam,ctl,playing=false,mesh,cum=[],tmax=1,ign0=0,pa=0,C,cumM=[],cumC=[],GJ=[],geoG;

async function proc(from,to,w,h,es){
 let e2=es;
 if(S.noscl)e2=es.replace('"SCL",',es.includes('"B02"')?'':'"B02",').replace(/!\[[\d,]+\]\.includes\(s\.SCL\)/,'s.B02<.25');
 let r;const sl=z=>new Promise(f=>setTimeout(f,z));
 for(let k=0;k<8;k++){
 // all workers pause together while the server is rate-limiting (429)
 const wt=cool-Date.now();if(wt>0)await sl(wt);
 try{r=await fetch(OGC+S.iid+'?'+new URLSearchParams({SERVICE:'WMS',VERSION:'1.1.1',REQUEST:'GetMap',LAYERS:S.lay,SRS:'EPSG:4326',BBOX:S.bb.join(','),
  WIDTH:w,HEIGHT:h,FORMAT:'image/png',TIME:(from+'/'+to).replace(/\.\d+Z/g,'Z'),MAXCC:S.cc,EVALSCRIPT:btoa(e2),SHOWLOGO:'false',TRANSPARENT:'false'}))}catch(e){if(k==7)throw e;await sl(2e3*(k+1));continue}
 if(r.status<500&&r.status!=429||k==7)break;
 const ra=+r.headers.get('Retry-After'),d=ra>0?ra*1e3:Math.min(3e4,2e3*2**k);cool=Math.max(cool,Date.now()+d);nRetry++;
 if(!rl||!rl.isConnected)rl=log('');rl.textContent=L('  Сервер ачаалалтай (','  Server busy (')+r.status+L(') — хүлээгээд дахин оролдож байна: ',') — waiting and retrying: ')+nRetry+'\n'}
 if(!r.ok){
  const tx=(await r.text()).replace(/<!\[CDATA\[|\]\]>/g,' ').replace(/<[^>]+>/g,' ').replace(/&apos;/g,"'").replace(/&quot;/g,'"').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/\s+/g,' ').trim();
  if(e2.includes('"SCL"')&&/SCL/.test(tx)){if(!S.noscl){S.noscl=true;log(L('Давхарга SCL-гүй (L1C) байна — үүл/цасыг спектрийн босгоор масклана.','Layer has no SCL (L1C) — clouds/snow are masked by spectral thresholds.'))};return proc(from,to,w,h,es)}
  throw Error('WMS '+r.status+' ['+S.lay+'] '+(tx||L('(хариу хоосон)','(empty response)')).slice(0,300));
 }
 const bm=await createImageBitmap(await r.blob(),{colorSpaceConversion:'none',premultiplyAlpha:'none'});
 const c=document.createElement('canvas');c.width=w;c.height=h;
 const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(bm,0,0);
 return{c,d:x.getImageData(0,0,w,h).data};
}
function days(ign,end){
 const o=[];
 for(let t=Date.UTC(ign.getUTCFullYear(),ign.getUTCMonth(),ign.getUTCDate());t<=Date.parse(end+'T00:00:00Z');t+=864e5){
  const d=new Date(t).toISOString().slice(0,10),pt=Date.parse(d+'T02:40:00Z');if(pt>ign)o.push({d,t:pt})}
 return o;
}
async function lst(){
 const id=$('iid').value.trim();if(!id){$('cfg').open=true;$('iid').focus();return log(L('Sentinel Hub License Number оруулна уу.','Enter the Sentinel Hub License Number.'),1)}
 try{
  const r=await fetch(OGC+id+'?SERVICE=WMS&REQUEST=GetCapabilities');if(!r.ok)throw Error('HTTP '+r.status);
  const x=new DOMParser().parseFromString(await r.text(),'text/xml'),sel=$('lay');sel.innerHTML='';
  x.querySelectorAll('Layer>Layer').forEach(l=>{const n=l.querySelector('Name');if(n){const o=document.createElement('option');o.value=o.textContent=n.textContent;sel.add(o)}});
  if(!sel.options.length)throw Error(L('давхарга олдсонгүй','no layers found'));
  let w='';try{w=localStorage.lay||''}catch(e){}
  sel.value=[...sel.options].some(o=>o.value==w)?w:([...sel.options].find(o=>/L2A/i.test(o.value))||sel.options[0]).value;
  return true;
  }catch(e){log(L('Жагсаалт татаж чадсангүй: ','Could not load list: ')+e.message+L(' — License Number-ээ шалгана уу.',' — check the License Number.'),1);$('cfg').open=true}
}
async function terrain(dw,dh){
 const[w,s,e,n]=S.bb,mx=l=>(l+180)/360,my=l=>{const r=l*Math.PI/180;return(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2};
 let z=10,t;for(;;z--){const q=2**z;t=[Math.floor(mx(w)*q),Math.floor(mx(e)*q),Math.floor(my(n)*q),Math.floor(my(s)*q)];if((t[1]-t[0]+1)*(t[3]-t[2]+1)<=36)break}
 const q=2**z,cv=document.createElement('canvas');cv.width=(t[1]-t[0]+1)*256;cv.height=(t[3]-t[2]+1)*256;
 const x=cv.getContext('2d',{willReadFrequently:true}),jobs=[];
 for(let i=t[0];i<=t[1];i++)for(let j=t[2];j<=t[3];j++)jobs.push((async()=>{
  const r=await fetch(`https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${z}/${i}/${j}.png`);if(!r.ok)throw Error('terrain '+r.status);
  x.drawImage(await createImageBitmap(await r.blob(),{colorSpaceConversion:'none',premultiplyAlpha:'none'}),(i-t[0])*256,(j-t[2])*256)})());
 await Promise.all(jobs);
 const id=x.getImageData(0,0,cv.width,cv.height).data,o=new Uint8ClampedArray(dw*dh*4);
 for(let r=0;r<dh;r++)for(let c=0;c<dw;c++){
  const px=Math.min(cv.width-1,Math.max(0,Math.round((mx(w+(e-w)*c/(dw-1))*q-t[0])*256))),py=Math.min(cv.height-1,Math.max(0,Math.round((my(n-(n-s)*r/(dh-1))*q-t[2])*256))),
  k=(py*cv.width+px)*4,v=Math.max(0,Math.min(65535,Math.round(id[k]*256+id[k+1]+id[k+2]/256-32768+500))),u=(r*dw+c)*4;o[u]=v>>8;o[u+1]=v&255}
 return{d:o};
}
function enhance(c){
 const x=c.getContext('2d',{willReadFrequently:true}),im=x.getImageData(0,0,c.width,c.height),d=im.data,hist=new Uint32Array(256);
 let n=0,sr=0,sg=0,sb=0;
 for(let i=0;i<d.length;i+=4)if(d[i]|d[i+1]|d[i+2]){hist[Math.round(.3*d[i]+.59*d[i+1]+.11*d[i+2])]++;n++;sr+=d[i];sg+=d[i+1];sb+=d[i+2]}
 if(!n)return;
 let a=0,lo=0,hi=255;for(let i=0;i<256;i++){a+=hist[i];if(a<n*.02)lo=i;if(a<n*.985)hi=i}
 hi=Math.max(hi,lo+20);
 const mr=sr/n,mg=sg/n,mb=sb/n,f=v=>Math.pow(Math.max(0,Math.min(1,(v-lo)/(hi-lo))),.85)*255;
 for(let i=0;i<d.length;i+=4){
  let r=d[i],g=d[i+1],b=d[i+2];if(!(r|g|b)){r=mr;g=mg;b=mb}
  const L=.3*r+.59*g+.11*b;
  d[i]=f(L+(r-L)*1.3);d[i+1]=f(L+(g-L)*1.3);d[i+2]=f(L+(b-L)*1.3);d[i+3]=255}
 x.putImageData(im,0,0);
}
function clean(M,N,W){
 // strict: keep only the single largest 4-connected component of M
 const lab=new Int32Array(N),st=[],cnt=[0];let nl=0,best=0;
 for(let i=0;i<N;i++)if(M[i]&&!lab[i]){nl++;lab[i]=nl;let n=0;st.push(i);
  while(st.length){const j=st.pop(),c=j%W;n++;
   if(c>0&&M[j-1]&&!lab[j-1]){lab[j-1]=nl;st.push(j-1)}
   if(c<W-1&&M[j+1]&&!lab[j+1]){lab[j+1]=nl;st.push(j+1)}
   if(j>=W&&M[j-W]&&!lab[j-W]){lab[j-W]=nl;st.push(j-W)}
   if(j+W<N&&M[j+W]&&!lab[j+W]){lab[j+W]=nl;st.push(j+W)}}
  cnt[nl]=n;if(n>cnt[best])best=nl}
 const R=new Uint8Array(N);if(best)for(let i=0;i<N;i++)R[i]=lab[i]==best?1:0;
 return R;
}
function sidesOf(){
 if(C.sd!==undefined)return C.sd;
 const{W,Ht,N}=C,[w,s,e,n]=S.bb,wall=new Uint8Array(N);let any=0;
 const seg=(a,b)=>{const x0=(a[0]-w)/(e-w)*W,y0=(n-a[1])/(n-s)*Ht,x1=(b[0]-w)/(e-w)*W,y1=(n-b[1])/(n-s)*Ht;
  if(Math.max(x0,x1)<0||Math.min(x0,x1)>W||Math.max(y0,y1)<0||Math.min(y0,y1)>Ht)return;
  const k=Math.ceil(Math.max(Math.abs(x1-x0),Math.abs(y1-y0))*2)||1;
  for(let j=0;j<=k;j++){const x=Math.floor(x0+(x1-x0)*j/k),y=Math.floor(y0+(y1-y0)*j/k);if(x>=0&&x<W&&y>=0&&y<Ht){wall[y*W+x]=1;any=1}}},
 ring=r=>{for(let i=1;i<r.length;i++)seg(r[i-1],r[i])};

function geoms(o,pr,out=[]){
 if(!o)return out;
 if(o.type=='FeatureCollection')o.features.forEach(f=>geoms(f,0,out));
 else if(o.type=='Feature')geoms(o.geometry,o.properties,out);
 else if(o.type=='GeometryCollection')o.geometries.forEach(g=>geoms(g,pr,out));
 else out.push({type:o.type,coordinates:o.coordinates,props:pr});
 return out;
}
function zAt(m,x,y){

}
