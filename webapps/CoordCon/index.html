<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<title>Солбицол/файл хөрвүүлэгч</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/shpjs@3.6.3/dist/shp.min.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/help.css">
</head>
<body>
<header>
<div class="lg"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg></div>
<div><h1>Солбицол/файл хөрвүүлэгч</h1><p>UTM · Гаусс–Крюгер · TM · GeoJSON · KML · GPX · DXF · SHP</p></div>
<span class="sp"></span><button id="hq">❓ Лавлах</button> <button id="mt">🗺 Зураг нуух</button> <button id="th" title="Dark / Light">☾</button>
</header>
<main>
<section class="cd pn">
<div class="t">Оролтын систем <span><button id="im">⬆ Файл</button> <button id="ex">Жишээ</button> <button id="cl">Цэвэрлэх</button><input type="file" id="fi" hidden multiple accept=".geojson,.json,.kml,.kmz,.gpx,.wkt,.csv,.txt,.dxf,.zip,.shp,.dbf,.prj"></span></div>
<select id="is"><option value="auto">Автоматаар таних</option><option value="wgs">WGS84 — градус / ГМС</option><option value="utm">UTM (WGS84)</option><option value="gk6">Гаусс-Крюгер 6°</option><option value="gk3">Гаусс-Крюгер 3°</option><option value="tm">TM (өөрийн параметртэй)</option><option value="cart">Cartesian (ECEF X Y Z)</option><option value="wm">Web Mercator</option></select><div class="pp" id="ip"></div>
<div class="t">Солбицол</div>
<textarea id="in" spellcheck="false" placeholder="Солбицлаа энд буулгана уу…&#10;47.9184 106.9177&#10;48T 650123 5310456&#10;5310456 18650123"></textarea>
<div class="t">Гаралтын систем</div>
<select id="os">
<option value="dd">WGS84 — градус (φ λ)</option><option value="ddl">WGS84 — градус (λ φ)</option><option value="dms">WGS84 — градус-минут-секунд</option>
<option value="utm">UTM (WGS84)</option><option value="gk6">Гаусс-Крюгер 6° (Красовский)</option><option value="gk3">Гаусс-Крюгер 3° (Красовский)</option><option value="tm">TM (өөрийн параметртэй)</option><option value="cart">Cartesian (ECEF X Y Z)</option><option value="wm">Web Mercator (EPSG:3857)</option>
</select>
<div class="pp" id="op"></div>
<div class="t">Гаралт <button id="cp" class="pr">Хуулах</button></div>
<textarea id="out" readonly spellcheck="false"></textarea>
<div class="xr"><select id="xf"><option value="geojson">GeoJSON</option><option value="kml">KML</option><option value="kmz">KMZ</option><option value="gpx">GPX</option><option value="wkt">WKT</option><option value="csv">CSV</option><option value="dxf">DXF</option><option value="txt">Текст (.txt)</option><option value="shp">Shapefile (.shp .shx .dbf .prj)</option><option value="shpz">Shapefile (ZIP)</option><option value="zip">ZIP — бүх формат</option></select><button id="xb" class="pr">⬇ Экспорт</button></div>
<div id="msg"></div><div id="err"></div>
<div class="t">Объектууд</div><div id="ls"></div>
<div class="mu">Заавар, форматын тайлбар → дээд талын «❓ Лавлах» товч.</div>
</section>
<section class="cd mp"><canvas id="map"></canvas>
<img class="wm" alt="" draggable="false" src="assets/numan-logo.png">
<div class="ctl"><button id="zi">+</button><button id="zo">−</button><button id="ft" title="Бүгдийг харах">⤢</button></div>
<div class="lay"><select id="ly"></select></div><div class="st"><span id="cur">—</span></div>
</section>
</main>
<div id="hp" class="hp" hidden><div class="hc cd"><div class="hh"><b>Лавлах — апп ашиглах заавар</b><button id="hx">✕</button></div><div class="tb" id="tb"></div><div class="hd" id="hd"></div></div></div>
<script src="js/geo.js"></script>
<script src="js/parser.js"></script>
<script src="js/format.js"></script>
<script src="js/map.js"></script>
<script src="js/app.js"></script>
<script src="js/import.js"></script>
<script src="js/export.js"></script>
<script src="js/help.js"></script>
<script src="js/main.js"></script>
</body>
</html>
