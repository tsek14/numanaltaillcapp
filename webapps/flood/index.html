<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flood Risk Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#0f172a;--panel:#1e293b;--panel2:#0b1222;--border:#334155;--accent:#38bdf8;--text:#e2e8f0;--muted:#94a3b8;--err:#f87171;--ok:#4ade80}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 'Inter','Segoe UI',system-ui,sans-serif}
a{color:var(--accent)}
header{display:flex;align-items:center;gap:12px;padding:14px 18px 6px;flex-wrap:wrap}
header h1{margin:0;font-size:1.45rem;font-weight:800;color:var(--accent);letter-spacing:-.02em}
header p{margin:0;color:var(--muted);font-size:.85rem}
header .sp{flex:1}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:#0284c7;border-color:#0284c7;color:#fff;font-weight:600}
.btn.pri:hover{background:#0369a1}
.btn.stop{background:#7f1d1d;border-color:#7f1d1d;color:#fff;font-weight:600}
.btn.sm{padding:5px 10px;font-size:.82rem}
.lang-switch{font-weight:700;font-size:.8rem;padding:5px 11px;border-radius:999px}
.note{margin:4px 18px 0;padding:7px 12px;border-radius:8px;background:#3b2f0b;border-left:4px solid #f59e0b;color:#fde68a;font-size:.8rem}
nav.tabs{display:flex;gap:4px;padding:10px 18px 0;border-bottom:1px solid var(--border);overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.page{display:none;padding:16px 18px}
.page.on{display:block}
#p-map.on{display:grid;grid-template-columns:minmax(290px,340px) 1fr;gap:16px}
@media(max-width:820px){#p-map.on{grid-template-columns:1fr}#map{height:62vh!important}}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px}
.h{font-weight:700;color:var(--accent);margin:0 0 8px}
label.f{display:block;font-size:.82rem;color:var(--muted);margin:10px 0 4px}
small.i{display:block;color:#64748b;font-size:.75rem;margin-top:3px}
input[type=text],input[type=number],textarea{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:92px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem}
.radios{display:flex;flex-direction:column;gap:4px}
.radios label{display:flex;gap:8px;align-items:center;cursor:pointer}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.row .btn{flex:1}
.status{margin-top:10px;padding:9px 12px;border-radius:8px;background:var(--panel2);border-left:4px solid var(--accent);font-size:.85rem;min-height:1em}
.status:empty{display:none}
.status.err{border-left-color:var(--err)}
hr{border:0;border-top:1px solid var(--border);margin:14px 0}
table{border-collapse:collapse;width:100%;font-size:.82rem}
th,td{border-bottom:1px solid var(--border);padding:5px 6px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
#map{height:calc(100vh - 205px);min-height:420px;border-radius:10px;border:1px solid var(--border)}
.mapnote{font-size:.77rem;color:#64748b;margin-top:6px;padding:6px 10px;background:var(--panel);border-radius:6px}
.legend{background:#fff;color:#111;padding:10px 14px;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.18);font-size:11px;line-height:1.3}
.legend b{display:block;font-size:13px;margin-bottom:6px}
.legend div{display:flex;align-items:center;gap:6px;margin:3px 0}
.legend i{width:16px;height:16px;border-radius:3px;display:inline-block}
.hover{background:rgba(15,23,42,.88);color:#e2e8f0;padding:5px 9px;border-radius:6px;font-size:12px}
.lbl{color:#fff;padding:2px 6px;border-radius:4px;font-size:11px;white-space:nowrap;font-weight:700;display:inline-block}
.sec{display:flex;gap:6px;align-items:center}.sec input{flex:1;min-width:0}
.legend .nd{display:block;margin-top:6px;color:#555;font-size:10.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.how{margin-top:16px;padding:12px 16px;background:#1e3a5f;border-radius:8px;border-left:4px solid var(--accent);font-size:.85rem}
.doc{max-width:860px}
.doc h2{color:var(--accent);font-size:1.15rem;margin:22px 0 8px}
.doc h3{font-size:1rem;margin:16px 0 6px}
.doc pre{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px;overflow-x:auto;font-size:.82rem}
.doc blockquote{margin:10px 0;padding:8px 14px;border-left:4px solid #f59e0b;background:#2a2410;border-radius:6px}
.doc table{margin:8px 0;max-width:640px}
.doc code{background:var(--panel2);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<header>
  <div><h1 data-t="title"></h1><p data-t="subtitle"></p></div>
  <span class="sp"></span>
  <button type="button" class="btn lang-switch" id="langBtn"></button>
</header>
<div class="note" data-t="demoNote"></div>

<nav class="tabs" id="tabs">
  <button type="button" data-p="map" class="on" data-t="tabMap"></button>
  <button type="button" data-p="region" data-t="tabRegion"></button>
  <button type="button" data-p="guide" data-t="tabGuide"></button>
  <button type="button" data-p="help" data-t="tabHelp"></button>
  <button type="button" data-p="about" data-t="tabAbout"></button>
</nav>

<!-- TAB 1: map & analysis -->
<section class="page on" id="p-map">
  <div>
    <div class="card">
      <div class="h" data-t="addLocation"></div>
      <label class="f" data-t="geomType"></label>
      <div class="radios" id="ftype">
        <label><input type="radio" name="ft" value="point" checked> <span data-t="typePoint"></span></label>
        <label><input type="radio" name="ft" value="line"> <span data-t="typeLine"></span></label>
        <label><input type="radio" name="ft" value="polygon"> <span data-t="typePolygon"></span></label>
      </div>
      <label class="f" for="coords" data-t="coordsLabel"></label>
      <textarea id="coords" placeholder="47.8550, 107.4200"></textarea>
      <small class="i" data-t="coordsInfo"></small>
      <label class="f" for="name" data-t="nameLabel"></label>
      <input type="text" id="name">
      <div class="row">
        <button type="button" class="btn pri" id="addBtn" data-t="add"></button>
        <button type="button" class="btn stop" id="clearBtn" data-t="clear"></button>
      </div>
      <div class="status" id="status"></div>
      <hr>
      <div class="h" style="font-size:.9rem" data-t="riskTable"></div>
      <div id="table"></div>
      <hr>
      <div style="font-size:.82rem;color:var(--muted);margin-bottom:6px" data-t="examples"></div>
      <div class="row" style="margin-top:0">
        <button type="button" class="btn sm" data-ex="0" data-t="ex1"></button>
        <button type="button" class="btn sm" data-ex="1" data-t="ex2"></button>
      </div>
      <div class="row" style="margin-top:6px">
        <button type="button" class="btn sm" data-ex="2" data-t="ex3"></button>
        <button type="button" class="btn sm" data-ex="3" data-t="ex4"></button>
      </div>
    </div>
  </div>
  <div>
    <div id="map"></div>
    <div class="mapnote" data-t="mapNote"></div>
  </div>
</section>

<!-- TAB 2: region settings -->
<section class="page" id="p-region">
  <div class="doc">
    <div class="h" style="font-size:1rem" data-t="regionTitle"></div>
    <div class="grid2">
      <div>
        <div style="color:var(--muted);font-size:.85rem" data-t="swCorner"></div>
        <label class="f" for="swLat" data-t="latSW"></label><input type="number" id="swLat" step="any"><small class="i" data-t="latMinInfo"></small>
        <label class="f" for="swLon" data-t="lonSW"></label><input type="number" id="swLon" step="any"><small class="i" data-t="lonMinInfo"></small>
      </div>
      <div>
        <div style="color:var(--muted);font-size:.85rem" data-t="neCorner"></div>
        <label class="f" for="neLat" data-t="latNE"></label><input type="number" id="neLat" step="any"><small class="i" data-t="latMaxInfo"></small>
        <label class="f" for="neLon" data-t="lonNE"></label><input type="number" id="neLon" step="any"><small class="i" data-t="lonMaxInfo"></small>
      </div>
    </div>
    <hr>
    <div class="h" style="font-size:.95rem" data-t="demTitle"></div>
    <div class="grid2">
      <div><label class="f" for="elMin" data-t="elevMin"></label><input type="number" id="elMin" step="1" disabled><small class="i" data-t="elevInfo"></small></div>
      <div><label class="f" for="elMax" data-t="elevMax"></label><input type="number" id="elMax" step="1" disabled><small class="i" data-t="elevInfo"></small></div>
    </div>
    <hr>
    <div class="h" style="font-size:.95rem" data-t="geeTitle"></div>
    <div class="grid2">
      <div><label class="f" for="scale" data-t="scaleLabel"></label><input type="number" id="scale" step="1" min="10"><small class="i" data-t="scaleInfo"></small></div>
    </div>
    <hr>
    <div class="h" style="font-size:.95rem" data-t="ndviTitle"></div>
    <label class="f" for="iid" data-t="licLabel"></label>
    <div class="sec" style="max-width:420px"><input type="password" id="iid" autocomplete="off" spellcheck="false" placeholder="••••••••••••" data-1p-ignore data-lpignore="true"><button type="button" class="btn sm" id="eye" aria-label="Show / hide" title="Show / hide">👁</button></div>
    <small class="i" data-t="licInfo"></small>
    <div class="row" style="margin-top:16px"><button type="button" class="btn pri" id="applyBtn" data-t="apply"></button></div>
    <div class="status" id="regionStatus"></div>
    <div class="how" data-t="howTo" data-html></div>
  </div>
</section>

<section class="page" id="p-guide"><div class="doc" data-t="guide" data-html></div></section>
<section class="page" id="p-help"><div class="doc" data-t="help" data-html></div></section>
<section class="page" id="p-about"><div class="doc" data-t="about" data-html></div></section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
'use strict';

/* ───────── language (shared with the other Numan apps) ───────── */
let LANG='en';
try{
  const q=new URLSearchParams(location.search).get('lang');
  if(q==='mn'||q==='en')localStorage.setItem('appLang',q);
  LANG=localStorage.getItem('appLang')==='mn'?'mn':'en';
}catch(e){}
document.documentElement.lang=LANG;

const I18N={

 kind:{point:'Point',line:'Line',polygon:'Polygon'},
 cls:{out:'Outside region',low:'Low',medlow:'Moderate-low',med:'Moderate',high:'High',vhigh:'Very high'},
 legendTitle:'Flood risk',
 baseMap:'Map',baseSat:'Satellite imagery',ovRisk:'Flood risk map',ovMine:'My features',
 popupScore:'Risk score',popupClass:'Class',hoverRisk:'Risk',
 errNoPoint:'Enter the point coordinates.',errPointOut:'The point is outside the region.',

 regionTitle:'Set the study area boundary',
 swCorner:'South-west corner (SW)',neCorner:'North-east corner (NE)',
 latSW:'Latitude (Lat SW)',lonSW:'Longitude (Lon SW)',latNE:'Latitude (Lat NE)',lonNE:'Longitude (Lon NE)',
 latMinInfo:'Smallest latitude',lonMinInfo:'Smallest longitude',latMaxInfo:'Largest latitude',lonMaxInfo:'Largest longitude',
 demTitle:'Elevation above sea level (DEM)',elevMin:'Lowest elevation (m)',elevMax:'Highest point (m)',
 elevInfo:'Calculated automatically from SRTM for the area',
 geeTitle:'Resolution',scaleLabel:'Scale — resolution (m)',scaleInfo:'30 = SRTM resolution (recommended). Large areas are calculated more coarsely.',

 errBig:'The area is too large (at most 3° × 3°).',errNum:'Fill in all numbers.',errPrefix:'Error: ',
 regionOk:(a,b,w,h,e1,e2,s)=>`Region updated — ${a}° × ${b}° (~${w} km × ${h} km) | Elevation: ${e1}–${e2} m | Resolution: ~${s} m`,
 loading:(n,m)=>`Downloading elevation and surface-water data… ${n}/${m}`,computing:'Calculating flood risk…',
 loadErr:m=>`Could not download the data (${m}). Check your internet connection.`,calcErr:m=>`Could not calculate the risk map (${m}).`,retry:'Try again',notReady:'The risk map is still loading — try again in a moment.',
 howTo:`<b>How to set it up</b><br>
1. In Google Maps, find the south-west corner of your area<br>
2. Right-click → copy the coordinates (lat, lon order)<br>
3. Do the same for the north-east corner<br>
4. Choose the resolution (30 m recommended)<br>
5. Press "Apply region and update map"`,
 guide:`<h2>Flood Risk Map — Guide</h2>
<h2>What is the flood risk index?</h2>
<p>The flood risk index is a <b>relative score from 0 to 100</b>. It is not water depth in litres or metres — it shows <b>which parts of this area are riskier than the others</b>.</p>
<h2>Weights of the 5 factors</h2>
<table><tr><th>Factor</th><th>Weight</th><th>Description</th></tr>
<tr><td><b>TWI</b> (water accumulation)</td><td><b>40%</b></td><td>Water collects in hollows and low ground</td></tr>
<tr><td><b>Slope</b></td><td><b>30%</b></td><td>On flat ground water does not run off, it collects</td></tr>
<tr><td><b>DEM</b> (elevation)</td><td><b>15%</b></td><td>Low ground is more at risk</td></tr>
<tr><td><b>JRC</b> (surface water)</td><td><b>10%</b></td><td>River banks and wetlands</td></tr>
<tr><td><b>NDVI</b> (vegetation)</td><td><b>5%</b></td><td>Bare ground absorbs less water — <i>needs a Sentinel Hub License Number</i></td></tr></table>
<p>NDVI is calculated from Sentinel-2 imagery through your Sentinel Hub account: the highest NDVI of last summer (June–August), which avoids clouds. Enter the Sentinel Hub License Number in Region settings (the same one as in the Wildfire simulation app). Without it, NDVI is left out and the other four weights are scaled up proportionally (TWI 42%, slope 32%, elevation 16%, JRC 10.5%). The score is the weighted sum × 100. The map legend shows whether NDVI was used.</p>
<h2>Risk classes</h2>
<table><tr><th>Score</th><th>Class</th><th>Colour</th></tr>
<tr><td>34–52</td><td>Low</td><td>Green</td></tr><tr><td>52–62</td><td>Moderate-low</td><td>Light green</td></tr>
<tr><td>62–72</td><td>Moderate</td><td>Yellow</td></tr><tr><td>72–85</td><td>High</td><td>Orange</td></tr>
<tr><td>85–98</td><td>Very high</td><td>Red</td></tr></table>
<h2>How to set the region</h2>
<p>Set these values in the <b>"Region settings"</b> tab.</p>
<h3>Coordinates</h3>
<p>Enter the coordinates of the south-west and north-east corners of the area. In Google Maps you can right-click to see coordinates.</p>
<pre>South-west:  Lat (latitude) = smaller number, Lon (longitude) = smaller number
North-east:  Lat (latitude) = larger number,  Lon (longitude) = larger number</pre>
<p><b>Example — Ulaanbaatar city:</b></p><ul><li>South-west: Lat = 47.87, Lon = 106.75</li><li>North-east: Lat = 47.98, Lon = 106.98</li></ul>
<p><b>Example — Terelj (default):</b></p><ul><li>South-west: Lat = 47.82, Lon = 107.35</li><li>North-east: Lat = 47.92, Lon = 107.52</li></ul>
<h3>Elevation range</h3>
<p>The lowest and highest elevation are calculated automatically from SRTM for the chosen area and shown in the settings. Elevation is scored from the lowest point (highest risk) to the highest point (lowest risk).</p>
<h3>Scale (resolution)</h3>
<table><tr><th>Value</th><th>Description</th></tr>
<tr><td><b>30</b></td><td>SRTM resolution (recommended)</td></tr>
<tr><td><b>60–120</b></td><td>Faster, for larger areas</td></tr></table>
<p>To keep the browser fast, large areas are calculated more coarsely than the chosen scale. The resolution used is shown after the update.</p>
<h2>Adding features</h2>
<h3>Point</h3><pre>47.8550, 107.4200</pre><p>One point per line — lat (latitude), then lon (longitude).</p>
<h3>Road / Line</h3><pre>47.8550, 107.4200
47.8600, 107.4350
47.8650, 107.4450</pre><p>Enter several points, one per line. The average risk along the line is calculated.</p>
<h3>Area / Polygon</h3><pre>47.8550, 107.4200
47.8600, 107.4350
47.8580, 107.4450
47.8520, 107.4300</pre><p>Enter 3 or more points. The average risk inside the area is calculated.</p>
<h2>Caution</h2>
<blockquote>This map shows <b>relative risk</b> — a comparison within the area. It does not answer "how much water will come".<br>Real calculations need a hydraulic model such as <b>HEC-RAS</b>.</blockquote>
<h2>Data sources</h2>
<ul><li><b>DEM</b>: SRTM elevation (~30 m), via AWS Terrain Tiles (Mapzen/Tilezen)</li>
<li><b>Slope, TWI</b>: calculated in the browser from the DEM (sink filling, D8 flow accumulation, TWI = ln(a / tan β))</li>
<li><b>JRC</b>: EC JRC / Google Global Surface Water 1984–2021, water occurrence</li>
<li><b>NDVI</b>: Copernicus Sentinel-2 via Sentinel Hub (Copernicus Data Space), highest NDVI of June–August — when a License Number is set</li>
<li><b>Base maps</b>: OpenStreetMap, Esri World Imagery</li></ul>`,
 help:`<h2>Help &amp; FAQ</h2>
<p><b>What do the scores mean?</b><br>The score is 0–100: the weighted sum of the factors × 100. Higher means more at risk. For the Terelj example, the original GEE calculation gave 34–98.</p>
<p><b>How is a line scored?</b><br>The average of 20 points along each segment of the line.</p>
<p><b>How is a polygon scored?</b><br>The average of 200 random points inside the area.</p>
<p><b>What if the coordinates are wrong?</b><br>Check the lat, lon order. For Mongolia, lat ≈ 42–52 and lon ≈ 87–119.</p>
<p><b>Does the risk map update after changing the region?</b><br>Yes. The map updates when you press "Apply region and update map".</p>
<p><b>Why does it say the point is outside the region?</b><br>The coordinates are outside the region boundary. Check the south-west / north-east corner coordinates.</p>
<p><b>How many points can I add?</b><br>No limit, but more than 20 may slow the map down.</p>
<p><b>Where does the data come from?</b><br>SRTM elevation and JRC Global Surface Water, downloaded by your browser when the map loads, plus Sentinel-2 NDVI from Sentinel Hub if a License Number is set. The License Number is kept only in this browser.</p>
<p><b>How do I add NDVI?</b><br>Enter your Sentinel Hub License Number in Region settings and press the update button. If it is already set in the Wildfire simulation or Area calculator app, it is used automatically.</p>
<p><b>Why does the map take a while to load?</b><br>The data is downloaded and the water flow is calculated for the whole area. Larger areas or finer scale take longer.</p>`,
 about:`<h2>About the app</h2>
<p>A web app that shows a flood risk model developed on Google Earth Engine for any area, and calculates the risk for points, roads and areas you enter.</p>
<h3>Technical details</h3>
<ul><li><b>Map model</b>: weighted composite index of SRTM + TWI + JRC + NDVI + Slope</li>
<li><b>Calculation</b>: the GEE model's factors and weights, calculated in the browser from SRTM, JRC and (with a Sentinel Hub License Number) Sentinel-2 data</li>
<li><b>Coverage</b>: any area in the world (set by coordinates)</li>
<li><b>Map resolution</b>: ~30 m (SRTM), coarser for large areas</li></ul>
<h3>Technology</h3><p>JavaScript · Leaflet · AWS Terrain Tiles · JRC Global Surface Water · Sentinel Hub · OpenStreetMap · Esri World Imagery</p>
<h3>Caution</h3><p>This map is a relative risk assessment intended for research and education only. Consult a qualified organisation before making real decisions.</p>
<p>© Numan-Altai LLC</p>`
},

 guide:`<h2>Үерийн эрсдлийн зураг — Гарын авлага</h2>
<h2>Үерийн эрсдлийн индекс гэж юу вэ?</h2>
<p>Үерийн эрсдлийн индекс нь <b>0–100 оноо</b> бүхий харьцангуй үзүүлэлт юм. Энэ нь усны гүн, литр, метр биш — харин <b>"энэ нутагт аль хэсэг нь бусдаасаа илүү эрсдэлтэй вэ?"</b> гэдгийг харуулна.</p>
<h2>5 хүчин зүйлийн жин</h2>
<table><tr><th>Хүчин зүйл</th><th>Жин</th><th>Тайлбар</th></tr>
<tr><td><b>TWI</b> (ус хуримтлах)</td><td><b>40%</b></td><td>Хотгор, нам газарт ус цуглардаг</td></tr>
<tr><td><b>Slope</b> (налуу)</td><td><b>30%</b></td><td>Хавтгай газарт ус урсахгүй, хуримтлагдана</td></tr>
<tr><td><b>DEM</b> (өндөр)</td><td><b>15%</b></td><td>Нам газар илүү эрсдэлтэй</td></tr>
<tr><td><b>JRC</b> (одоогийн ус)</td><td><b>10%</b></td><td>Голын хажуу, намаг</td></tr>
<tr><td><b>NDVI</b> (ургамал)</td><td><b>5%</b></td><td>Ургамалгүй газар ус шингэдэггүй — <i>Sentinel Hub License Number шаардлагатай</i></td></tr></table>
<p>NDVI-г таны Sentinel Hub бүртгэлээр Sentinel-2 зургаас тооцно: өнгөрсөн зуны (6–8-р сар) хамгийн их NDVI тул үүл нөлөөлөхгүй. Нутгийн тохиргоонд Sentinel Hub License Number оруулна (Түймрийн симулэшн апптай ижил). Оруулаагүй бол NDVI орохгүй, бусад дөрвөн жинг пропорциональ өсгөнө (TWI 42%, налуу 32%, өндөр 16%, JRC 10.5%). Оноо нь жигнэсэн нийлбэр × 100. NDVI ашигласан эсэхийг газрын зургийн тайлбарт харуулна.</p>
<h2>Эрсдлийн ангилал</h2>
<table><tr><th>Оноо</th><th>Ангилал</th><th>Өнгө</th></tr>
<tr><td>34–52</td><td>Бага</td><td>Ногоон</td></tr><tr><td>52–62</td><td>Дунд бага</td><td>Цайвар ногоон</td></tr>
<tr><td>62–72</td><td>Дунд</td><td>Шар</td></tr><tr><td>72–85</td><td>Өндөр</td><td>Улбар шар</td></tr>
<tr><td>85–98</td><td>Маш өндөр</td><td>Улаан</td></tr></table>
<h2>Нутгийн тохиргоо хэрхэн оруулах вэ?</h2>
<p><b>"Нутгийн тохиргоо"</b> табаас дараах утгуудыг тохируулна.</p>
<h3>Координат оруулах</h3>
<p>Нутгийн баруун урд ба зүүн хойд булангийн координатыг оруулна. Google Maps дээр хулганы баруун товчийг дарж координатыг харж болно.</p>
<pre>Баруун урд:  Lat (өргөрөг) = жижиг тоо, Lon (уртраг) = жижиг тоо
Зүүн хойд:   Lat (өргөрөг) = том тоо,   Lon (уртраг) = том тоо</pre>
<p><b>Жишээ — Улаанбаатар хот:</b></p><ul><li>Баруун урд: Lat = 47.87, Lon = 106.75</li><li>Зүүн хойд: Lat = 47.98, Lon = 106.98</li></ul>
<p><b>Жишээ — Тэрэлж (анхдагч):</b></p><ul><li>Баруун урд: Lat = 47.82, Lon = 107.35</li><li>Зүүн хойд: Lat = 47.92, Lon = 107.52</li></ul>
<h3>Өндөршлийн хязгаар</h3>
<p>Хамгийн нам ба хамгийн өндөр цэгийг сонгосон нутгийн SRTM өгөгдлөөс автоматаар тооцоолж, тохиргоонд харуулна. Өндрийн оноо хамгийн нам цэгт хамгийн их, хамгийн өндөр цэгт хамгийн бага байна.</p>
<h3>Scale (нарийвчлал)</h3>
<table><tr><th>Утга</th><th>Тайлбар</th></tr>
<tr><td><b>30</b></td><td>SRTM нарийвчлал (санал болгоно)</td></tr>
<tr><td><b>60–120</b></td><td>Илүү хурдан, том нутагт</td></tr></table>
<p>Хөтөч удаашрахгүйн тулд том нутгийг сонгосноос бүдүүн нарийвчлалаар тооцно. Ашигласан нарийвчлалыг шинэчилсний дараа харуулна.</p>
<h2>Тэмдэглэл нэмэх заавар</h2>
<h3>Цэг (Point)</h3><pre>47.8550, 107.4200</pre><p>Нэг мөрт нэг цэг — lat (өргөрөг), lon (уртраг) дараалан.</p>
<h3>Зам / Шугам (Line)</h3><pre>47.8550, 107.4200
47.8600, 107.4350
47.8650, 107.4450</pre><p>Хэд хэдэн цэгийг мөр тус бүрд оруулна. Замын дагуух дундаж эрсдлийг тооцоолно.</p>
<h3>Дүрс / Олон өнцөгт (Polygon)</h3><pre>47.8550, 107.4200
47.8600, 107.4350
47.8580, 107.4450
47.8520, 107.4300</pre><p>3-аас дээш цэг оруулна. Талбайн доторх дундаж эрсдлийг тооцоолно.</p>
<h2>Анхааруулга</h2>
<blockquote>Энэ зураг нь <b>харьцангуй эрсдэл</b> — нутаг доторх харьцуулалт. "Яг хэр их ус ирэх вэ" гэдэгт хариулахгүй.<br>Бодит тооцоололд <b>HEC-RAS</b> зэрэг гидравлик загвар шаардлагатай.</blockquote>
<h2>Мэдээллийн эх сурвалж</h2>
<ul><li><b>DEM</b>: SRTM өндөр (~30 м), AWS Terrain Tiles (Mapzen/Tilezen)-ээр</li>
<li><b>Налуу, TWI</b>: DEM-ээс хөтөч дотор тооцоологдоно (хонхор дүүргэх, D8 урсацын хуримтлал, TWI = ln(a / tan β))</li>
<li><b>JRC</b>: EC JRC / Google Global Surface Water 1984–2021, ус илрэх давтамж</li>
<li><b>NDVI</b>: Copernicus Sentinel-2, Sentinel Hub (Copernicus Data Space)-ээр, 6–8-р сарын хамгийн их NDVI — License Number оруулсан үед</li>
<li><b>Суурь зураг</b>: OpenStreetMap, Esri World Imagery</li></ul>`,
 help:`<h2>Тусламж &amp; Түгээмэл асуулт</h2>
<p><b>Оноо юуг илэрхийлэх вэ?</b><br>Оноо 0–100: хүчин зүйлсийн жигнэсэн нийлбэр × 100. Их байх тусам эрсдэл өндөр. Тэрэлжийн жишээнд GEE-ийн анхны тооцоо 34–98 гарсан.</p>
<p><b>Шугамын оноо хэрхэн тооцоологддог вэ?</b><br>Шугамын хэсэг бүрийн дагуух 20 цэгийн дундаж.</p>
<p><b>Олон өнцөгтийн оноо хэрхэн тооцоологддог вэ?</b><br>Талбай доторх 200 санамсаргүй цэгийн дундаж.</p>
<p><b>Координат алдаатай бол яах вэ?</b><br>lat, lon дарааллыг шалгана уу. Монгол орны хувьд lat ≈ 42–52, lon ≈ 87–119.</p>
<p><b>Нутгийг өөрчилсний дараа эрсдлийн зураг шинэчлэгддэг үү?</b><br>Тийм. "Нутаг тохируулах ба зураг шинэчлэх" товчийг дарахад зураг шинэчлэгдэнэ.</p>
<p><b>Яагаад цэг нутгаас гадна гэж гардаг вэ?</b><br>Оруулсан координат нутгийн хилийн гадна байна. Нутгийн баруун урд / зүүн хойд булангийн координатыг шалгана уу.</p>
<p><b>Хэдэн цэг нэмж болох вэ?</b><br>Хязгааргүй. Гэхдээ 20-оос дээш бол зураг удаашрах магадлалтай.</p>
<p><b>Өгөгдөл хаанаас ирдэг вэ?</b><br>SRTM өндөр ба JRC Global Surface Water-ийг зураг ачаалахад таны хөтөч татна. License Number оруулсан бол Sentinel Hub-аас Sentinel-2 NDVI мөн татна. License Number зөвхөн энэ хөтөчид хадгалагдана.</p>
<p><b>NDVI-г яаж нэмэх вэ?</b><br>Нутгийн тохиргоонд Sentinel Hub License Number-ээ оруулаад шинэчлэх товчийг дарна. Түймрийн симулэшн эсвэл Талбай тооцоологч апп-д аль хэдийн оруулсан бол автоматаар ашиглагдана.</p>
<p><b>Зураг яагаад удаан ачаалдаг вэ?</b><br>Өгөгдлийг татаж, бүх нутгийн усны урсацыг тооцоолдог. Том нутаг эсвэл нарийн нарийвчлал удаан болно.</p>`,
 about:`<h2>Аппын тухай</h2>
<p>Google Earth Engine дээр боловсруулсан үерийн эрсдлийн загварыг дурын нутагт харуулах, цэг/зам/дүрс оруулж эрсдлийг тооцоолох вэб апп.</p>
<h3>Техникийн мэдээлэл</h3>
<ul><li><b>Зургийн загвар</b>: SRTM + TWI + JRC + NDVI + Slope жинтэй нийлмэл индекс</li>
<li><b>Тооцоолол</b>: GEE загварын хүчин зүйл, жингээр SRTM, JRC болон (Sentinel Hub License Number-тэй үед) Sentinel-2 өгөгдлөөс хөтөч дотор тооцоологдоно</li>
<li><b>Хамрах нутаг</b>: дэлхийн дурын нутаг (координатаар тохируулна)</li>
<li><b>Зургийн нарийвчлал</b>: ~30 м (SRTM), том нутагт бүдүүн</li></ul>
<h3>Хэрэглэсэн технологи</h3><p>JavaScript · Leaflet · AWS Terrain Tiles · JRC Global Surface Water · Sentinel Hub · OpenStreetMap · Esri World Imagery</p>
<h3>Анхааруулга</h3><p>Энэ зураг нь харьцангуй эрсдлийн үнэлгээ бөгөөд зөвхөн судалгаа, боловсролын зориулалттай. Бодит шийдвэр гаргахдаа мэргэжлийн байгууллагатай зөвлөлдөнө үү.</p>

const T=I18N[LANG];
document.title=T.title;
document.querySelectorAll('[data-t]').forEach(el=>{const v=T[el.dataset.t];if(typeof v!=='string')return;if(el.hasAttribute('data-html'))el.innerHTML=v;else el.textContent=v});
document.getElementById('name').placeholder=T.namePh;

/* ───────── defaults (Terelj / Ulaanbaatar region from the GEE script) ───────── */
const DEF={lonMin:107.35,latMin:47.82,lonMax:107.52,latMax:47.92,scale:30};
// GEE weights. NDVI needs a Sentinel Hub account; without it the other four are scaled up.
const W0={twi:0.40,slope:0.30,elev:0.15,jrc:0.10,ndvi:0.05};
const OGC='https://sh.dataspace.copernicus.eu/ogc/wms/';
// Highest NDVI over last summer's passes (clouds lower NDVI, so the maximum avoids them).
const NDVI_ES=`//VERSION=3
function setup(){return{input:[{bands:["B04","B08","dataMask"]}],mosaicking:"ORBIT",output:{bands:3,sampleType:"UINT8"}}}
function preProcessScenes(c){c.scenes.orbits=c.scenes.orbits.slice(0,15);return c}
function evaluatePixel(a){let m=-2;for(const s of a){if(!s.dataMask)continue;const n=(s.B08-s.B04)/(s.B08+s.B04+1e-6);if(n>m)m=n}return m<-1.5?[0,0,0]:[Math.round((Math.max(-1,Math.min(1,m))+1)*127.5),255,0]}`;
// The Sentinel Hub instance ID ("License Number"), shared with the Wildfire simulation app.
const getIID=()=>{try{return(localStorage.getItem('iid')||'').trim()}catch(e){return''}};
const hideId=m=>String(m).replace(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/gi,'••••');
const summerYear=()=>{const d=new Date();return d.getUTCMonth()>=8?d.getUTCFullYear():d.getUTCFullYear()-1};
async function shLayer(iid){
  let lay='';try{lay=localStorage.getItem('lay')||''}catch(e){}
  if(lay)return lay;
  const r=await fetch(OGC+iid+'?SERVICE=WMS&REQUEST=GetCapabilities');if(!r.ok)throw new Error('HTTP '+r.status);
  const names=[...new DOMParser().parseFromString(await r.text(),'text/xml').querySelectorAll('Layer>Layer>Name')].map(n=>n.textContent);
  if(!names.length)throw new Error('no layers');

  const t=document.getElementById('table');
  t.innerHTML=S.features.length?`<table><tr><th>${T.thNo}</th><th>${T.thName}</th><th>${T.thType}</th><th>${T.thScore}</th><th>${T.thClass}</th></tr>`+
    S.features.map((f,i)=>{const[k,col]=riskClass(f.v);return`<tr><td>${i+1}</td><td>${esc(f.name)}</td><td>${T.kind[f.type]}</td><td>${f.v==null?'—':f.v.toFixed(1)}</td><td><span class="sw" style="background:${col}"></span><b>${T.cls[k]}</b></td></tr>`}).join('')+'</table>':'';
}

/* ───────── 6. UI ───────── */
const $=id=>document.getElementById(id);
const status=(el,html,err)=>{el.innerHTML=html;el.classList.toggle('err',!!err)};
const curType=()=>document.querySelector('input[name=ft]:checked').value;
const HINT={point:'47.8550, 107.4200',line:'47.8550, 107.4200\n47.8600, 107.4350\n47.8650, 107.4450',polygon:'47.8550, 107.4200\n47.8600, 107.4350\n47.8580, 107.4450\n47.8520, 107.4300'};
document.querySelectorAll('input[name=ft]').forEach(r=>r.onchange=()=>{$('coords').placeholder=HINT[curType()]});

$('addBtn').onclick=()=>{
  if(!G)return status($('status'),T.notReady,1);
  const co=parseCoords($('coords').value);
  if(!co.length)return status($('status'),T.errParse,1);
  const type=curType(),r=computeRisk(type,co);
  if(r.err)return status($('status'),r.err,1);
  const name=$('name').value.trim()||`${T.kind[type]} ${S.features.length+1}`;
  S.features.push({type,co,name,v:r.v});save();drawFeatures();
  status($('status'),T.added(esc(name),r.v.toFixed(1),T.cls[riskClass(r.v)[0]]));
};
$('clearBtn').onclick=()=>{S.features=[];save();drawFeatures();status($('status'),T.cleared)};

const EX=[['point','47.8520, 107.4150','exName1'],['line','47.8480, 107.3980\n47.8530, 107.4200\n47.8580, 107.4450\n47.8620, 107.4680','exName2'],
  ['point','47.8850, 107.4950','exName3'],['polygon','47.8510, 107.4100\n47.8550, 107.4250\n47.8530, 107.4400\n47.8480, 107.4300\n47.8460, 107.4150','exName4']];
document.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{const e=EX[+b.dataset.ex];document.querySelector(`input[name=ft][value=${e[0]}]`).checked=true;$('coords').value=e[1];$('name').value=T[e[2]];$('coords').placeholder=HINT[e[0]]});

// Download data and compute the risk map for the current region.
async function refresh(fit,report){
  const id=++loadId,b=busy.getContainer();G=null;drawRegion();
  if(fit){const R=S.region;map.setView([(R.latMin+R.latMax)/2,(R.lonMin+R.lonMax)/2],zoomFor(R))}
  b.style.display='';b.textContent=T.loading(0,'…');$('applyBtn').disabled=true;
  try{
    const g=await buildGrid(S.region,(n,m)=>{if(id===loadId)b.textContent=n<0?T.computing:T.loading(n,m)});
    if(id!==loadId)return;
    G=g;$('ndState').textContent=G.ndYear?T.ndviOn(G.ndYear):T.ndviOff;
    if(G.ndErr){b.textContent=T.ndviErr(G.ndErr);setTimeout(()=>{if(id===loadId)b.style.display='none'},9000)}else b.style.display='none';
    $('elMin').value=Math.round(G.eMin);$('elMax').value=Math.round(G.eMax);
    S.features.forEach(f=>{const r=computeRisk(f.type,f.co);f.v=r.err?null:r.v});save();
    drawRegion();drawFeatures();
    if(report)report();
  }catch(e){
    if(id!==loadId)return;
    b.innerHTML=esc(e.download?T.loadErr(e.message):T.calcErr(e.message))+' <button type="button" class="btn sm" id="retryBtn">'+T.retry+'</button>';
    $('retryBtn').onclick=()=>refresh(false,report);
  }finally{if(id===loadId)$('applyBtn').disabled=false}
}

// region settings
$('iid').value=getIID();
$('eye').onclick=()=>{const i=$('iid');i.type=i.type==='password'?'text':'password'};
const R0=S.region;$('swLat').value=R0.latMin;$('swLon').value=R0.lonMin;$('neLat').value=R0.latMax;$('neLon').value=R0.lonMax;$('scale').value=R0.scale;
$('applyBtn').onclick=()=>{
  const n=id=>parseFloat($(id).value),sa=n('swLat'),so=n('swLon'),na=n('neLat'),no=n('neLon'),sc=n('scale');
  if([sa,so,na,no,sc].some(v=>!isFinite(v)))return status($('regionStatus'),T.errPrefix+T.errNum,1);
  const errs=[];if(sa>=na)errs.push(T.errLat);if(so>=no)errs.push(T.errLon);
  if(!errs.length&&(na-sa>3||no-so>3))errs.push(T.errBig);
  if(errs.length)return status($('regionStatus'),T.errPrefix+errs.join(' | '),1);
  S.region={lonMin:so,latMin:sa,lonMax:no,latMax:na,scale:Math.max(10,Math.round(sc))};save();
  try{const v=$('iid').value.trim();if(v)localStorage.setItem('iid',v);else localStorage.removeItem('iid')}catch(e){}
  status($('regionStatus'),T.loading(0,'…'));
  refresh(true,()=>{
    const w=(no-so)*111.32*Math.cos((sa+na)/2*Math.PI/180),h=(na-sa)*111.32;
    status($('regionStatus'),T.regionOk((na-sa).toFixed(4),(no-so).toFixed(4),w.toFixed(1),h.toFixed(1),Math.round(G.eMin),Math.round(G.eMax),Math.round(G.res)));
  });
};

// tabs
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id==='p-'+b.dataset.p));
  if(b.dataset.p==='map')setTimeout(()=>map.invalidateSize(),0);
});

// language switch
const lb=$('langBtn');lb.textContent=LANG==='en'?'MN':'EN';lb.title=LANG==='en'?'Монгол хэл':'English';
lb.onclick=()=>{try{localStorage.setItem('appLang',LANG==='en'?'mn':'en')}catch(e){}const u=new URL(location.href);u.searchParams.delete('lang');location.replace(u.href)};

drawFeatures();refresh(true);
})();
</script>
